name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  splitsafari:
    name: SplitSafari web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/SplitSafari
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/SplitSafari/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Verify API and access controls with an isolated database
        run: |
          export SPLITSAFARI_DATABASE_PATH="$RUNNER_TEMP/splitsafari-test.sqlite"
          export SPLITSAFARI_TEST_ORIGIN=http://127.0.0.1:3002
          npm start > "$RUNNER_TEMP/splitsafari.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent "$SPLITSAFARI_TEST_ORIGIN/app/SplitSafari/api/safari"; then break; fi
            sleep 1
          done
          npm run test:api

  api:
    name: API tests
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://example.invalid
      SUPABASE_JWKS_URL: https://example.invalid/.well-known/jwks.json
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn --batch-mode verify

  web:
    name: SmartRent web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

  portfolio:
    name: Portfolio web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/portfolio
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: apps/portfolio/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
